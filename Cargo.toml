[package]
name = "PinPicture"
version = "1.1.0"
edition = "2021"
description = "Pin any picture to the desktop: topmost, click-through, transparent, animated"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff", "ico"] }
rfd = "0.18"
tray-icon = "0.27"
winreg = "0.56"

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = "thin"
